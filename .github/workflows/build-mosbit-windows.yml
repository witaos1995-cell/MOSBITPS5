name: Compilar Mosbit para Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-mosbit:
    name: Compilar Mosbit (Windows x64)
    runs-on: windows-latest
    env:
      sdl2_compat_tag: 2.32.74
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p
            compiler-rt:p
            
      - name: Install python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libbplacebo
        run: |
          scripts/build-libplacebo-windows.sh

      - name: Setup ffmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          unzip ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/bin/." /mingw64/bin
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/include/." /mingw64/include
          cp -a "ffmpeg-n9.0-latest-win64-gpl-shared-9.0/lib/." /mingw64/lib

      - name: Build sdl2-compat
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          INSTALL_PREFIX=/mingw64 scripts/build-hidapi.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki
          
      - name: Deploy chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh Mosbit-Win build/gui/Mosbit.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml


      - name: Subir Mosbit portable
        uses: actions/upload-artifact@v7
        with:
          name: Mosbit-Portable
          path: Mosbit-Win
          if-no-files-found: error
          retention-days: 30

      - name: Crear instalador
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: "scripts/mosbit.iss"
          options: /O+

      - name: Subir instalador
        uses: actions/upload-artifact@v7
        with:
          name: Mosbit-Instalador
          path: Mosbit-Instalador.exe
          if-no-files-found: error
          retention-days: 30
